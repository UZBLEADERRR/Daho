<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
<style>
*, *::before, *::after { box-sizing: border-box; }

/* Daho — tun (asosiy) */
:root {
  --bg: #09090b;
  --surface: #121215;
  --surface-2: #1a1a1f;
  --line: #26262c;
  --text: #ededf0;
  --muted: #8f8f99;
  --accent: #8b7cf6;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --danger: #f4655f;
  --ok: #4ec98a;
  --radius: 14px;
}
.kun {
  --bg: #fbfbfc;
  --surface: #ffffff;
  --surface-2: #f2f2f5;
  --line: #e3e3e8;
  --text: #17171a;
  --muted: #6c6c78;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  /* Tokenlar shu daraxtda qayta hisoblanishi uchun rang shu yerda ham beriladi */
  background: var(--bg);
  color: var(--text);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.005em;
}
svg { display: block; }

/* ---- tipografika ---- */
.display { font-size: 22px; font-weight: 660; letter-spacing: -0.025em; margin: 0; }
.h2 { font-size: 17px; font-weight: 640; letter-spacing: -0.015em; margin: 0; }
.b  { font-size: 14.5px; font-weight: 550; }
.muted { color: var(--muted); font-size: 13px; }
.tiny { font-size: 11.5px; color: var(--muted); }
.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
}

/* ---- karkas ---- */
.row { display: flex; align-items: center; gap: 9px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
.grow { flex: 1 1 auto; min-width: 0; }
.col { display: flex; flex-direction: column; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pad { padding: 14px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 13px;
}

/* ---- boshqaruvlar ---- */
.btn {
  background: var(--accent); color: #fff; border: none;
  border-radius: 11px; padding: 11px 16px; font: inherit;
  font-size: 14.5px; font-weight: 550;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
}
.btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn.mini { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
.btn.wide { width: 100%; }
.btn.off { opacity: 0.45; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center; color: var(--muted);
  background: none; border: none; flex: 0 0 auto;
}
.icon-btn.on { color: var(--accent); background: var(--accent-soft); }

.round-btn {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; color: var(--muted);
  background: none; border: none; flex: 0 0 auto;
}
.round-btn.primary { background: var(--accent); color: #fff; }
.round-btn.rec { background: var(--danger); color: #fff; }

.chip {
  font-size: 12.5px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted);
  border: 1px solid var(--line); white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip.sm { font-size: 11.5px; padding: 3px 9px; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.field > span {
  display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px;
}
.input {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; width: 100%; color: var(--muted);
}
.input.focus { border-color: var(--accent); color: var(--text); }

.switch {
  width: 40px; height: 23px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line);
  position: relative; flex: 0 0 auto;
}
.switch i {
  position: absolute; top: 2px; left: 2px; width: 17px; height: 17px;
  border-radius: 50%; background: var(--muted);
}
.switch.on { background: var(--accent-soft); border-color: var(--accent); }
.switch.on i { left: auto; right: 2px; background: var(--accent); }

/* ---- qatorlar ---- */
.action-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 11px 12px; border-radius: 13px; border: 1px solid transparent;
}
.action-row.on { background: var(--accent-soft); border-color: var(--accent); }
.action-icon {
  width: 38px; height: 38px; border-radius: 11px; background: var(--surface-2);
  display: grid; place-items: center; flex: 0 0 auto; color: var(--muted);
}
.model-row, .prov-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px 12px; border-radius: 11px;
  background: var(--surface); border: 1px solid var(--line); text-align: left;
}
.model-row.off { opacity: 0.5; }
.model-row.on { border-color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: 0 0 auto; }
.dot.on { background: var(--ok); }

/* ---- ilova karkasi ---- */
.phone {
  width: 390px; height: 844px; background: var(--bg);
  display: flex; flex-direction: column; overflow: hidden;
}
.status {
  height: 44px; flex: 0 0 auto; display: flex; align-items: flex-end;
  justify-content: space-between; padding: 0 20px 6px;
  font-size: 12px; font-weight: 600; color: var(--text);
}
.topbar {
  height: 52px; flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 0 8px; border-bottom: 1px solid var(--line);
}
.tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: 11px; padding: 3px; margin: 0 auto; }
.tab { padding: 6px 18px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--muted); }
.tab.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.seg {
  display: flex; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line);
  flex: 0 0 auto; overflow: hidden;
}
.seg .chip { flex: 0 0 auto; }
.body { flex: 1 1 auto; min-height: 0; overflow: hidden; }
.composer { flex: 0 0 auto; padding: 6px 10px 14px; }
.composer-box {
  display: flex; align-items: flex-end; gap: 4px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px;
}
.composer-box .txt { flex: 1 1 auto; padding: 10px 6px; color: var(--muted); font-size: 15px; }

/* ---- suhbat ---- */
.msgs { display: flex; flex-direction: column; gap: 16px; padding: 16px 14px 8px; }
.msg-user {
  align-self: flex-end; max-width: 86%; background: var(--accent); color: #fff;
  padding: 10px 14px; border-radius: 17px 17px 4px 17px; font-size: 15px;
}
.md p { margin: 0 0 10px; }
.md h3 { font-size: 16px; font-weight: 640; margin: 16px 0 7px; letter-spacing: -0.01em; }
.md ul { margin: 0 0 10px; padding-left: 21px; }
.md li { margin-bottom: 4px; }
.msg-actions { display: flex; gap: 3px; margin-top: 8px; }
.msg-actions span {
  font-size: 11.5px; color: var(--muted); padding: 4px 9px;
  border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
}
.tool-line {
  display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 11px; margin-bottom: 10px;
}
.code {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden; margin-bottom: 10px;
}
.code header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 11px; border-bottom: 1px solid var(--line);
  font-size: 11.5px; color: var(--muted);
}
.code pre {
  margin: 0; padding: 11px; font: 12px/1.6 ui-monospace, 'SF Mono', Menlo, monospace;
  color: var(--text); white-space: pre; overflow: hidden;
}
.k { color: #c4b5fd; } .s { color: #86dfae; } .c { color: var(--muted); }

.wrap { background: #060608; min-height: 100%; padding: 0 0 26px; }
.chrome {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.dots { display: flex; gap: 6px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); display: block; }
.url {
  flex: 1 1 auto; display: flex; align-items: center; gap: 7px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; font-size: 11px; color: var(--muted);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.ext-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: var(--accent-soft); }
.ext-mark {
  width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 12px; font-weight: 700; letter-spacing: -.03em;
}
.ext-mark.sm { width: 22px; height: 22px; border-radius: 7px; font-size: 12.5px; }

.popup {
  width: 348px; margin: 12px 16px 0 auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.6);
  position: relative;
}
.popup::before {
  content: ''; position: absolute; top: -6px; right: 26px; width: 11px; height: 11px;
  background: var(--surface); border-left: 1px solid var(--line); border-top: 1px solid var(--line);
  transform: rotate(45deg);
}
.p-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
.brand { font-size: 15px; font-weight: 660; letter-spacing: -.03em; }
.brand span { color: var(--accent); }
.ctx {
  display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px;
}
.qa {
  display: flex; align-items: center; gap: 11px; font-size: 13.5px;
  padding: 9px 10px; border-radius: 11px; border: 1px solid transparent;
}
.qa.on { background: var(--accent-soft); border-color: var(--accent); }
.qi {
  width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2);
  display: grid; place-items: center; color: var(--muted); flex: 0 0 auto;
}
.qa.on .qi { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.kbd {
  font: 10.5px ui-monospace, Menlo, monospace; color: var(--muted);
  border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; background: var(--surface-2);
}
.ask {
  display: flex; align-items: center; gap: 8px; margin-top: 14px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 5px 5px 14px; font-size: 13px; color: var(--muted);
}
.p-foot { display: flex; align-items: center; gap: 9px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
</style>
</helmet>
<div class="wrap">
  <div class="chrome">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="url"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10.5" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>uz.wikipedia.org/wiki/Sunʼiy_intellekt</div>
    <div class="ext-btn"><span class="ext-mark">D</span></div>
  </div>

  <div class="popup">
    <div class="p-head">
      <div class="row" style="gap:9px">
        <span class="ext-mark sm">D</span>
        <span class="brand">Daho<span>.</span></span>
      </div>
      <span class="chip sm"><span class="dot on"></span>ulangan</span>
    </div>

    <div class="ctx">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c4.5 5 4.5 12 0 17-4.5-5-4.5-12 0-17z"/></svg>
      <span class="grow trunc">Sunʼiy intellekt — Vikipediya</span>
      <span class="tiny">4 210 soʻz</span>
    </div>

    <div class="section-label" style="margin:16px 0 8px">Tez amallar</div>
    <div class="qa on"><span class="qi"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 6h14M5 11h14M5 16h8"/></svg></span><span class="grow">Sahifani qisqacha aytib ber</span><span class="kbd">S</span></div>
    <div class="qa"><span class="qi"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M8.5 6c0 5-2 8-4.5 10M6.5 12.5c2 2.5 4.5 4 7 4.5M13 20l4.5-11L22 20M15 16.5h5"/></svg></span><span class="grow">Tanlangan matnni tarjima qil</span><span class="kbd">T</span></div>
    <div class="qa"><span class="qi"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8 5 12l4 4M15 8l4 4-4 4"/></svg></span><span class="grow">Koddagi xatoni tushuntir</span><span class="kbd">K</span></div>
    <div class="qa"><span class="qi"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg></span><span class="grow">Konspektga saqla</span><span class="kbd">N</span></div>

    <div class="ask">
      <span class="grow">Sahifa haqida soʻrang…</span>
      <span class="round-btn primary" style="width:30px;height:30px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span>
    </div>

    <div class="p-foot">
      <span class="chip sm on"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="display:inline-block;vertical-align:-1px"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg> Avto · qwen3-max</span>
      <span class="tiny grow" style="text-align:right">Panelda ochish ›</span>
    </div>
  </div>
</div>
</x-dc>
