<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daho</title>
<link rel="stylesheet" href="panel.css" />
<body>
  <header>
    <b>Daho</b>
    <span id="source" class="chip">sahifa</span>
    <button id="settings" class="icon" title="Sozlamalar">⚙</button>
  </header>

  <section id="setup" hidden>
    <p class="hint">
      Ishlashi uchun Gemini kaliti kerak. Kalit faqat shu brauzerda saqlanadi.
    </p>
    <input id="key" type="password" placeholder="AIza…" autocomplete="off" />
    <button id="save" class="primary">Saqlash</button>
    <p class="hint">Kalitni aistudio.google.com/apikey dan bepul olasiz.</p>
  </section>

  <section id="main">
    <div class="quick">
      <button data-ask="Shu sahifadagi asosiy fikrlarni 5 ta band qilib ayt.">Qisqacha</button>
      <button data-ask="Izohlarni tahlil qil: mavzular boʻyicha guruhla, nechtadan ekanini ayt, koʻp takrorlanadigan savollarni alohida koʻrsat.">Izohlar</button>
      <button data-ask="Bu videodan toʻliq qoʻllanma yoz — bosqichma-bosqich, sarlavhalar bilan. Tayyor boʻlgach save_note bilan saqla.">Qoʻllanma</button>
      <button data-ask="Izohlardagi savollarga javob matnlarini tayyorla. Har biriga alohida, ismini ishlatib. Tayyor boʻlgach save_note bilan saqla.">Javoblar</button>
    </div>

    <textarea id="ask" rows="3" placeholder="Yoki topshiriq bering — agent oxirigacha bajaradi…"></textarea>
    <button id="run" class="primary">Bajarish</button>

    <div id="steps" class="steps"></div>
    <div id="out" class="out"></div>

    <div id="notes-wrap" hidden>
      <div class="section">Saqlanganlar</div>
      <div id="notes"></div>
    </div>
  </section>

  <script type="module" src="panel.js"></script>
</body>
