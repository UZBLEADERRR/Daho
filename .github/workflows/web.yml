name: Veb versiyani nashr qilish

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Yigʻish
    # Asosiy (default) tarmoqdan nashr qilinadi — tarmoq nomi oʻzgarsa ham
    # ish oqimini tahrirlash shart emas. Ikkinchi nom — veb versiya tarmogʻi:
    # PR qoʻshilgunicha jonli koʻrishga imkon beradi, keyin olib tashlansa
    # boʻladi.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch ||
      github.ref_name == 'claude/manashu-web-version-wclci1'
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js sozlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Paketlarni oʻrnatish
        run: npm ci

      - name: Yigʻish
        # Bulut sozlanmagan boʻlsa ham yigʻiladi — ilova mahalliy rejimda ishlaydi.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Pages uchun tayyorlash
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Nashr
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: GitHub Pages ga chiqarish
        id: deploy
        uses: actions/deploy-pages@v4
