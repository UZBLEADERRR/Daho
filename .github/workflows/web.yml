name: Veb versiyani nashr qilish

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Yigʻish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js sozlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Paketlarni oʻrnatish
        run: npm ci

      - name: Build muhitini tekshirish
        run: |
          node --version
          npm --version
          node -e "const p=require('./package.json'); console.log('build script:', p.scripts?.build || '(yoʻq)')"
          test -f index.html
          test -f vite.config.ts

      - name: TypeScript tekshiruvi
        run: npx tsc --noEmit

      - name: Vite production build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build

      - name: Pages uchun tayyorlash
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Nashr
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: GitHub Pages ga chiqarish
        id: deploy
        uses: actions/deploy-pages@v4