name: APK yasash

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  # Reliz yasash uchun yozish huquqi kerak (APK ochiq havolaga chiqadi).
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js sozlash
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Java 17 sozlash
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK sozlash
        uses: android-actions/setup-android@v3

      - name: Paketlarni oʻrnatish
        run: npm ci

      - name: Veb qismini yigʻish
        run: npm run build

      - name: Capacitor sinxronizatsiyasi
        run: npx cap sync android

      - name: Gradle wrapper ruxsati
        run: chmod +x android/gradlew

      - name: Debug APK yigʻish
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK nomini oʻzgartirish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk daho.apk

      - name: APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: daho-apk
          path: daho.apk
          if-no-files-found: error
          retention-days: 90

      # Artefaktni yuklab olish uchun GitHub'ga kirish kerak va u zip boʻlib
      # tushadi — telefonda noqulay. Shuning uchun APK ni relizga ham
      # qoʻyamiz: ochiq, bitta bosishda oʻrnatiladigan havola boʻladi.
      - name: Relizga qoʻyish
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.ref_name == github.event.repository.default_branch ||
          contains(github.event.head_commit.message, '[apk]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Daho APK #${{ github.run_number }}"
          files: daho.apk
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          body: |
            Telefonga oʻrnatish uchun pastdagi **daho.apk** faylini yuklab oling.
            Android «Nomaʼlum manbalardan oʻrnatish» ruxsatini soʻrashi mumkin.

            Tarmoq: `${{ github.ref_name }}`
            Commit: ${{ github.sha }}
